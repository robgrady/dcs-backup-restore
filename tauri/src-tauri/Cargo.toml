[package]
name = "dcs-backup-restore"
version = "1.0.0"
description = "Backup and restore DCS World settings with peripheral UUID remapping"
authors = ["robgrady"]
license = "MIT"
repository = "https://github.com/robgrady/dcs-backup-restore"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3" }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
regex = "1"
chrono = "0.4"
zip = "2"
walkdir = "2"
dirs = "6"
